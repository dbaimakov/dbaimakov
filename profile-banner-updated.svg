    <path d="M480 0 V320" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M640 0 V320" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M800 0 V320" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M960 0 V320" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M1120 0 V320" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  <g opacity="0.18" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M910 58 C1000 92 1060 82 1160 120" />
    <path d="M880 160 C960 124 1050 152 1180 96" />
    <path d="M880 240 C980 208 1050 250 1205 220" />
  </g>
