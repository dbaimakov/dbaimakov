<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Dmitry Baimakov profile banner</title>
  <desc id="desc">Blue and white GitHub profile banner highlighting cybersecurity, secure backend engineering, Android, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071A3D"/>
      <stop offset="45%" stop-color="#0A4FC4"/>
      <stop offset="100%" stop-color="#EAF3FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#02112B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <g opacity="0.18">
