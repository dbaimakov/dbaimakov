  <g font-family="Segoe UI, Inter, Arial, sans-serif" fill="#FFFFFF">
    <text x="92" y="112" font-size="18" font-weight="700" letter-spacing="2.5">GITHUB PROFILE</text>
    <text x="92" y="164" font-size="46" font-weight="800">Dmitry Baimakov</text>
    <text x="92" y="206" font-size="20" font-weight="600" fill="#E7F2FF">Cybersecurity Engineer · Secure Backend Engineer</text>
    <text x="92" y="244" font-size="18" fill="#F4F8FF">Application Security • Java &amp; Spring • Android • Databases • Observability</text>
