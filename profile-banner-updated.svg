    <circle cx="960" cy="56" r="6" fill="#FFFFFF" fill-opacity="0.92"/>
    <circle cx="1092" cy="98" r="8" fill="#BEE0FF"/>
    <circle cx="1182" cy="134" r="6" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="884" cy="170" r="6" fill="#FFFFFF" fill-opacity="0.75"/>
    <circle cx="1052" cy="160" r="7" fill="#9ED0FF"/>
    <circle cx="1160" cy="212" r="8" fill="#BEE0FF"/>
    <circle cx="944" cy="244" r="7" fill="#FFFFFF" fill-opacity="0.92"/>
    <circle cx="1090" cy="258" r="6" fill="#9ED0FF"/>
